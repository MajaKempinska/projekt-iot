{% extends "base.html" %}
{% block title %}Kontakt{% endblock %}
{% block head %}
<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
<style>
body { background-image: url('/static/tlo.jpg'); background-size: cover; background-attachment: fixed; font-family: Arial; padding: 20px; text-align: center; }
.box { background-color: rgba(8,18,42,0.92); color: #dce6f5; max-width: 500px; margin: 0 auto; padding: 40px; border-radius: 15px; }
h1 { font-family: 'Audiowide', sans-serif; font-size: 42px; letter-spacing: 2px; transition: all 0.3s ease; cursor: pointer; background: linear-gradient(90deg, #ff4db8, #c44bff, #6e8bff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 1px rgba(230,200,255,0.6)); }
h1:hover { background: linear-gradient(90deg, #6e8bff, #c44bff, #ff4db8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; transform: scale(1.05); }
label { display: block; text-align: left; margin: 15px 0 5px 0; font-weight: bold; cursor: pointer; }
label .ikona { display: inline-block; transition: transform 0.3s ease; }
label:hover .ikona { transform: scale(1.4); }
input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: none; box-sizing: border-box; font-family: Arial; font-size: 15px; }
textarea { min-height: 100px; resize: vertical; }
.btn { display: inline-block; margin-top: 20px; padding: 12px 30px; border-radius: 25px; border: none; cursor: pointer; color: #fff; font-weight: bold; font-size: 15px; background: linear-gradient(90deg, #8e2de2, #ff6ec4); transition: all 0.3s ease; }
.btn:hover { background: linear-gradient(90deg, #ff6ec4, #8e2de2); transform: scale(1.05); }
.powrot { display: inline-block; margin-top: 20px; font-weight: bold; text-decoration: none; transition: all 0.3s ease; background: linear-gradient(90deg, #8e2de2, #ff6ec4); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.powrot:hover { background: linear-gradient(90deg, #ff6ec4, #8e2de2); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; transform: scale(1.1); }
</style>
{% endblock %}
{% block content %}
<div class="box">
<h1>Kontakt</h1>
<form method="POST" action="/kontakt">
<label for="imie"><span class="ikona">👤</span> Imię</label>
<input type="text" id="imie" name="imie" required>
<label for="email"><span class="ikona">✉️</span> E-mail</label>
<input type="email" id="email" name="email" required>
<label for="wiadomosc"><span class="ikona">💬</span> Wiadomość</label>
<textarea id="wiadomosc" name="wiadomosc" required></textarea>
<br>
<button type="submit" class="btn">Wyślij</button>
</form>
<a class="powrot" href="/">Powrót</a>
</div>
{% endblock %}
